<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guinea Pig 3D Preview</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%90%B9%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="stage">
  <canvas id="view" aria-label="3D model of a guinea pig. Drag to rotate; pinch or use the mouse wheel to zoom."></canvas>
  <div class="title">
    <h1>Guinea Pig</h1>
    <p>Drag to rotate, pinch or scroll to zoom<br>Tap the guinea pig to pet it</p>
  </div>
  <div class="status" id="status">Loading…</div>
  <div class="controls">
    <div class="seg" role="radiogroup" aria-label="Behavior">
      <button type="button" role="radio" data-state="idle" aria-checked="true">Idle</button>
      <button type="button" role="radio" data-state="walk" aria-checked="false">Walk</button>
    </div>
    <button type="button" id="btn-wheek" class="act">Squeak</button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" id="btn-sound" aria-pressed="true"><span class="dot"></span>Sound</button>
    <button type="button" id="btn-fur" aria-pressed="true"><span class="dot"></span>Fur</button>
    <button type="button" id="btn-bones" aria-pressed="false"><span class="dot"></span>Bones</button>
  </div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
